name: Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify access to DietIA
        continue-on-error: true
        run: |
          echo "Testando se METRICS_TOKEN consegue acessar Danton-org/DietIA..."
          git clone --depth 1 "https://x-access-token:${{ secrets.METRICS_TOKEN }}@github.com/Danton-org/DietIA.git" test-dietia || echo "ATENCAO: Falha ao clonar DietIA com o METRICS_TOKEN atual!"
          if [ -d "test-dietia" ]; then
            echo "SUCESSO: Repositorio Danton-org/DietIA clonado com sucesso!"
            rm -rf test-dietia
          fi
      - name: Patch metrics image for private repositories
        run: |
          docker pull ghcr.io/lowlighter/metrics:v3.35-beta
          cat << 'EOF' > patch.js
          const fs = require('fs');

          // 1. Patch private repository clone authentication
          const file = '/metrics/source/plugins/languages/analyzer/analyzer.mjs';
          if (fs.existsSync(file)) {
            let c = fs.readFileSync(file, 'utf8');
            c = c.replace('let url = /^https?:\\/\\//.test(repo) ? repo : `https://github.com/${repo}`', 'let url = /^https?:\\/\\//.test(repo) ? repo : `https://${process.env.INPUT_TOKEN}@github.com/${repo}`');
            fs.writeFileSync(file, c, 'utf8');
            console.log('Patched analyzer.mjs successfully!');
          }

          // 2. Patch indepth commit filtering and ignore vendor/venv
          const indepthFile = '/metrics/source/plugins/languages/analyzer/indepth.mjs';
          if (fs.existsSync(indepthFile)) {
            let indepth = fs.readFileSync(indepthFile, 'utf8');
            // Disable git log --grep so other members' commits mentioning author are not falsely added
            indepth = indepth.replace(/git log --grep=[\s\S]*?--no-merges/g, 'true');
            // Ignore virtual environments, vendor, and dependencies
            indepth = indepth.replace(
              'if (this.markers.file.test(line)) {',
              'if (this.markers.file.test(line)) {\n            const fileRel = line.match(this.markers.file)?.groups?.file || "";\n            if (/(\\.venv|venv|node_modules|site-packages)[\\/\\\\]/i.test(fileRel)) { edition = null; return; }'
            );
            fs.writeFileSync(indepthFile, indepth, 'utf8');
            console.log('Patched indepth.mjs successfully!');
          }
          EOF
          cat << 'EOF' > Dockerfile
          FROM ghcr.io/lowlighter/metrics:v3.35-beta
          COPY patch.js /patch.js
          RUN node /patch.js && rm /patch.js
          EOF
          docker build -t metrics:3.35.0-beta .

      - uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          use_prebuilt_image: no

          user: BrunoDanton
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Maceio

          repositories: 100

          repositories_affiliations: owner, collaborator

          debug: yes
          config_animations: no

          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_threshold: 0%
          plugin_languages_details: bytes-size, percentage, lines
          plugin_languages_sections: most-used, recently-used

          plugin_languages_indepth: yes
          commits_authoring: danton.carneiro@dcomp.ufs.br, BrunoDanton, Bruno Danton
          plugin_languages_indepth_custom: Danton-org/DietIA@0.1/master, Danton-org/DietIA@BrunoDanton/feat/smart-recipes-system

          plugin_achievements: no
          plugin_achievements_threshold: C

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_lines: yes

          plugin_followup: yes
          plugin_followup_sections: user, repositories

          plugin_notable: yes

          filename: github-metrics.svg
