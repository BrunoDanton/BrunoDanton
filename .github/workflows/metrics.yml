name: Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify access to DietIA
        continue-on-error: true
        run: |
          echo "Testando se METRICS_TOKEN consegue acessar Danton-org/DietIA..."
          git clone --depth 1 "https://x-access-token:${{ secrets.METRICS_TOKEN }}@github.com/Danton-org/DietIA.git" test-dietia || echo "ATENCAO: Falha ao clonar DietIA com o METRICS_TOKEN atual!"
          if [ -d "test-dietia" ]; then
            echo "SUCESSO: Repositorio Danton-org/DietIA clonado com sucesso!"
            rm -rf test-dietia
          fi

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: BrunoDanton
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Maceio

          repositories: yes

          repositories_affiliations: owner, collaborator, organization_member

          debug: yes
          config_animations: no

          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_threshold: 0%
          plugin_languages_details: bytes-size, percentage, lines
          plugin_languages_sections: most-used, recently-used

          plugin_languages_indepth: yes
          commits_authoring: BrunoDanton, Bruno Danton, danton.carneiro@dcomp.ufs.br
          plugin_languages_indepth_custom: Danton-org/DietIA

          plugin_achievements: no
          plugin_achievements_threshold: C

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_lines: yes

          plugin_followup: yes
          plugin_followup_sections: user, repositories

          plugin_notable: yes

          filename: github-metrics.svg
